<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Stylesheet path linking to CSS file, using Jinja2 code -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <!-- Integrating Font Awesome icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>Writing Companion</title>
</head>
<body>
    <!-- Creating a logo for the app, using Font Awesome icons -->
    <h1><i class="fa-solid fa-book-open"></i><i class="fa-solid fa-feather-pointed"></i> Feeling inspired today?</h1>

    <!-- Creating the text box and submit button -->
    <form action="/analyze" method="POST">
        <label for="manuscript_text">Tell me your story here:</label><br>
        <textarea id="manuscript_text" name="manuscript_text" rows="15" cols="80" required></textarea><br><br>
        <button type="submit">Get feedback</button>
    </form>
</body>
</html>
